<div class="browse-page">
  <div class="article-breadcrumb">{{{breadcrumb}}}</div>

  <div class="browse-header">
    <h1 class="page-title">{{sectionLabel}}</h1>
    <span class="browse-count" id="browseCount">{{count}} articles</span>
  </div>

  <div class="browse-toolbar">
    <div class="browse-sort-group">
      <button class="browse-sort-btn active" data-sort="newest">最新</button>
      <button class="browse-sort-btn" data-sort="oldest">最早</button>
      <button class="browse-sort-btn" data-sort="az">A–Z</button>
    </div>
    <button class="browse-group-btn" id="browseGroupBtn" title="按月份分组">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="1" y="3" width="14" height="11" rx="1.5"/>
        <path d="M1 7h14M5 1v4M11 1v4"/>
      </svg>
      按月分组
    </button>
  </div>

  <div class="{{containerClass}}" id="browseGrid">
    {{{items}}}
  </div>
</div>
