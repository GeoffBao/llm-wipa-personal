<div class="flipbook-page" data-slug="{{slug}}">

  <div class="flipbook-topbar">
    <a href="/wiki/{{slug}}" class="flipbook-back" title="Back to article">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
      Article
    </a>
    <span class="flipbook-title" id="flipbook-title">{{title}}</span>
    <span class="flipbook-stats" id="flipbook-stats">Generative pixel UI · grounded in your vault</span>
    <button class="flipbook-btn" id="flipbook-back-btn" title="Previous page" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <button class="flipbook-btn" id="flipbook-debug-btn" title="Toggle hotspot outlines">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      Hotspots
    </button>
  </div>

  <div class="flipbook-stage" id="flipbook-stage">
    <div class="flipbook-frame" id="flipbook-frame">
      <svg id="flipbook-svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="flipbook-title"></svg>
      <div class="flipbook-loading" id="flipbook-loading">
        <div class="flipbook-spinner"></div>
        <div class="flipbook-loading-text" id="flipbook-loading-text">Building visual frame…</div>
        <div class="flipbook-loading-sub">This view is rendered locally from your vault graph. No image model is required.</div>
      </div>
      <div class="flipbook-error" id="flipbook-error" hidden>
        <div class="flipbook-error-msg" id="flipbook-error-msg"></div>
        <button class="flipbook-error-retry" id="flipbook-error-retry">Retry</button>
      </div>
    </div>
  </div>

  <div class="flipbook-tip" id="flipbook-tip">
    Click the center card to explore deeper. Click outer cards to open the linked vault article.
  </div>

</div>

<style>
  .flipbook-page { display: flex; flex-direction: column; min-height: calc(100vh - 140px); }

  .flipbook-topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 4px 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .flipbook-back {
    display: flex; align-items: center; gap: 4px;
    color: var(--blue); text-decoration: none; font-size: .85rem;
  }
  .flipbook-back:hover { color: var(--blue-hover); }
  .flipbook-title {
    font-size: .95rem; font-weight: 700; letter-spacing: -0.015em;
    color: var(--text);
  }
  .flipbook-stats {
    font-size: .72rem; color: var(--text-light);
    margin-right: auto;
  }
  .flipbook-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    font-size: .78rem; font-weight: 500; color: var(--text-muted);
    cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s, color .12s;
  }
  .flipbook-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }
  .flipbook-btn:disabled { opacity: .4; cursor: not-allowed; }
  .flipbook-btn.active { background: var(--blue-light); border-color: rgba(26,86,219,.3); color: var(--blue); }
  .flipbook-btn svg { width: 13px; height: 13px; }

  .flipbook-stage {
    flex: 1; display: flex; align-items: flex-start; justify-content: center;
  }
  .flipbook-frame {
    position: relative;
    width: min(1024px, 100%, calc(100vh - 190px));
    min-width: min(100%, 560px);
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow-md, 0 4px 24px rgba(120,80,20,.10));
    background: var(--bg);
    border: 1px solid var(--border);
  }
  #flipbook-svg {
    width: 100%; height: 100%; display: block;
    background:
      radial-gradient(circle at 50% 48%, rgba(26,86,219,.08), transparent 28%),
      linear-gradient(180deg, rgba(255,255,255,.36), transparent 55%),
      var(--bg);
    user-select: none;
  }
  .fb-edge { stroke: rgba(107,95,80,.28); stroke-width: 2; fill: none; marker-end: url(#fb-arrow); }
  .fb-edge-muted { stroke-dasharray: 6 8; }
  .fb-card { cursor: pointer; }
  .fb-card-rect {
    fill: rgba(255,255,255,.78);
    stroke: var(--border);
    stroke-width: 1.5;
    filter: drop-shadow(0 5px 10px rgba(120,80,20,.08));
    transition: fill .12s, stroke .12s;
  }
  .fb-card:hover .fb-card-rect {
    fill: #fff;
    stroke: rgba(26,86,219,.42);
  }
  .fb-card-open:hover .fb-card-rect { stroke: rgba(217,119,6,.55); }
  .fb-card-center .fb-card-rect {
    fill: rgba(239,246,255,.95);
    stroke: rgba(26,86,219,.34);
  }
  .fb-title {
    fill: var(--text);
    font-family: var(--font-sans);
    font-size: 24px;
    font-weight: 750;
    letter-spacing: -0.03em;
  }
  .fb-card-center .fb-title { font-size: 31px; }
  .fb-subtitle {
    fill: var(--text-light);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
  }
  .fb-kicker {
    fill: var(--blue);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .fb-node-index {
    fill: rgba(217,119,6,.12);
    stroke: rgba(217,119,6,.28);
    stroke-width: 1;
  }
  .fb-node-index-text {
    fill: #b45309;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
  }
  .flipbook-debug .fb-card-rect {
    stroke-width: 3;
    stroke-dasharray: 7 5;
  }

  .flipbook-loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg);
    color: var(--text-muted);
    gap: 14px; padding: 24px; text-align: center;
  }
  .flipbook-spinner {
    width: 38px; height: 38px;
    border: 3px solid rgba(26,86,219,.18);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: flipbook-spin 0.9s linear infinite;
  }
  @keyframes flipbook-spin { to { transform: rotate(360deg); } }
  .flipbook-loading-text { font-size: .95rem; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .flipbook-loading-sub { font-size: .78rem; color: var(--text-light); max-width: 360px; line-height: 1.5; }

  .flipbook-error {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: var(--bg);
  }
  .flipbook-error[hidden] { display: none; }
  .flipbook-error-msg {
    font-size: .85rem; color: #b91c1c; max-width: 600px; line-height: 1.5;
    background: rgba(185,28,28,.06); border: 1px solid rgba(185,28,28,.18);
    border-radius: 8px; padding: 12px 16px;
    font-family: var(--font-mono, "JetBrains Mono", monospace); word-break: break-word; text-align: left;
    white-space: pre-wrap;
  }
  .flipbook-error-retry {
    background: var(--blue); color: #fff; border: none; border-radius: 7px;
    padding: 7px 16px; font-size: .85rem; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .flipbook-error-retry:hover { background: var(--blue-hover); }

  .flipbook-tip {
    margin-top: 18px;
    text-align: center;
    font-size: .78rem;
    color: var(--text-light);
    line-height: 1.5;
  }
</style>

<script src="/public/js/flipbook.js" defer></script>
