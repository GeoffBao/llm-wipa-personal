<div class="books-page">

  <!-- Header -->
  <div class="books-header">
    <div class="books-header-title">
      <svg style="width:22px;height:22px;vertical-align:-4px;margin-right:8px;opacity:.75;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0 3-3h7z"/></svg>
      <h1 class="page-title" style="display:inline">Books</h1>
    </div>
    <div class="rw-header-actions">
      <a href="https://weread.qq.com" target="_blank" rel="noopener" class="rw-open-btn rw-chat-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;margin-right:5px"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0 3-3h7z"/></svg>
        微信读书
      </a>
      <a href="https://readwise.io/reader" target="_blank" rel="noopener" class="rw-open-btn">
        Readwise
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;margin-left:4px"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </div>
  <div class="books-header-stats">
    <span class="rw-hstat"><strong>{{totalBooks}}</strong> books</span>
    <span class="rw-hstat-sep">·</span>
    <span class="rw-hstat">{{totalFinished}} finished</span>
    <span class="rw-hstat-sep">·</span>
    <span class="rw-hstat">{{totalNotes}} highlights</span>
    <span class="rw-hstat-sep">·</span>
    <span class="rw-hstat">{{wereadCount}} WeRead · {{readwiseCount}} Readwise · {{appleCount}} Apple Books</span>
  </div>

  <!-- Heatmap -->
  <div class="rw-dashboard" style="margin-bottom:1.5rem">
    <div class="rw-dashboard-main" style="width:100%">
      <div class="rw-dashboard-label">Reading activity — past year</div>
      {{{heatmapHtml}}}
    </div>
  </div>

  <!-- Source tabs -->
  <div class="lib-tabs">{{{tabsHtml}}}</div>

  <!-- Year-grouped book list -->
  {{{groupsHtml}}}

</div>

<!-- Highlights panel (Apple Books) -->
<div id="hl-overlay" class="hl-overlay" hidden></div>
<aside id="hl-panel" class="hl-panel" hidden aria-label="Book highlights">
  <div class="hl-panel-header">
    <div class="hl-panel-meta">
      <div id="hl-panel-title" class="hl-panel-title"></div>
      <div id="hl-panel-author" class="hl-panel-author"></div>
    </div>
    <button id="hl-panel-close" class="hl-panel-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="hl-panel-body" class="hl-panel-body"></div>
</aside>

<script>
(function () {
  const overlay = document.getElementById('hl-overlay');
  const panel   = document.getElementById('hl-panel');
  const titleEl = document.getElementById('hl-panel-title');
  const authorEl= document.getElementById('hl-panel-author');
  const bodyEl  = document.getElementById('hl-panel-body');
  const closeBtn= document.getElementById('hl-panel-close');

  function openPanel(data) {
    titleEl.textContent  = data.title;
    authorEl.textContent = data.author || '';
    bodyEl.innerHTML = data.highlights.map((h, i) =>
      `<div class="hl-item">
        <div class="hl-item-num">${i + 1}</div>
        <div class="hl-item-content">
          <blockquote class="hl-quote">${escHtml(h.text)}</blockquote>
          ${h.note ? `<div class="hl-note">${escHtml(h.note)}</div>` : ''}
          ${h.date ? `<div class="hl-date">${h.date}</div>` : ''}
        </div>
      </div>`
    ).join('');
    overlay.hidden = false;
    panel.hidden   = false;
    requestAnimationFrame(() => {
      overlay.classList.add('hl-visible');
      panel.classList.add('hl-visible');
    });
    bodyEl.scrollTop = 0;
  }

  function closePanel() {
    overlay.classList.remove('hl-visible');
    panel.classList.remove('hl-visible');
    setTimeout(() => { overlay.hidden = true; panel.hidden = true; }, 250);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Delegate click on panel-trigger cards
  document.addEventListener('click', e => {
    const card = e.target.closest('.bk-card--panel');
    if (card) {
      try { openPanel(JSON.parse(card.dataset.highlights)); } catch {}
    }
  });

  // Keyboard: Enter/Space on panel cards
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const card = e.target.closest('.bk-card--panel');
      if (card) { e.preventDefault(); try { openPanel(JSON.parse(card.dataset.highlights)); } catch {} }
    }
    if (e.key === 'Escape') closePanel();
  });

  overlay.addEventListener('click', closePanel);
  closeBtn.addEventListener('click', closePanel);
})();
</script>
