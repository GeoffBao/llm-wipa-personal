<div class="search-page">
  <div class="search-page-header">
    <h1 class="page-title">Search</h1>
  </div>

  <form class="search-page-form" action="/search" method="get">
    <div class="search-page-input-wrap">
      <input type="search" name="q" value="{{query}}" placeholder="Search… or use tag:pkm · section:concepts · since:2026" class="search-page-input" autofocus autocomplete="off">
      <button type="submit" class="search-page-btn">Search</button>
    </div>
  </form>

  {{{filterChips}}}
  {{{hintHtml}}}

  <div class="search-results-meta">
    {{#if query}}
      <strong>{{resultCount}}</strong> results for "<strong>{{query}}</strong>"
    {{/if}}
  </div>

  {{{suggestedChips}}}

  <div class="search-results">
    {{{results}}}
  </div>
</div>
