<div class="journey-page">
  <div class="journey-header">
    <h1 class="page-title">
      <svg style="width:22px;height:22px;vertical-align:-4px;margin-right:6px;opacity:.75" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M12 6v6l4 2"/></svg>
      Journey
    </h1>
    <div class="journey-stats">
      <span><strong>{{totalEntries}}</strong> entries</span>
    </div>
    <div class="journey-view-tabs">
      <a href="/journey" class="journey-view-tab{{#if viewMonth}} active{{/if}}">月</a>
      <a href="/journey?view=week" class="journey-view-tab{{#if viewWeek}} active{{/if}}">周</a>
    </div>
  </div>

  <div class="journey-timeline">
    {{{groupsHtml}}}
  </div>
</div>
