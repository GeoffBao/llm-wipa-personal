<div class="readwise-page">
  <div class="rw-header">
    <div class="rw-header-title">
      <svg style="width:22px;height:22px;vertical-align:-4px;margin-right:8px;opacity:.75;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
      <h1 class="page-title" style="display:inline">Readwise</h1>
    </div>
    <div class="rw-header-actions">
      <a href="https://readwise.io/chat" target="_blank" rel="noopener" class="rw-open-btn rw-chat-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;margin-right:5px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </a>
      <a href="https://readwise.io/reader" target="_blank" rel="noopener" class="rw-open-btn">
        Open Reader
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;margin-left:4px"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </div>

  {{{statsHtml}}}
  {{{statusHtml}}}

  {{#if hasLocTabs}}
  <div class="rw-loc-tabs">{{{locTabsHtml}}}</div>
  {{/if}}

  <div class="rw-tabs">{{{catTabsHtml}}}</div>

  <div class="rw-feed">
    {{{cardsHtml}}}
    {{{emptyHtml}}}
  </div>
</div>

<script>
async function rwSync(incremental) {
  const btn = document.getElementById(incremental ? 'rw-sync-inc-btn' : 'rw-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '↻ Syncing…'; }
  try {
    await fetch('/api/readwise/sync' + (incremental ? '?mode=incremental' : ''), { method: 'POST' });
  } catch (e) {}
  setTimeout(() => location.reload(), 3000);
}
</script>
